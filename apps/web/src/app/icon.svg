<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    SpeakWise favicon. Mirrors the orange-gradient Wise orb that's the
    visual anchor of the app — same radial gradient stops as the
    in-product VoiceOrb (apps/web/src/components/voice/voice-orb.tsx),
    just packed into a 32×32 viewbox.

    Layers, outer → inner:
      1. Halo  — soft glow around the orb, matches the in-app
                 shadow-orb-glow effect.
      2. Orb   — main sphere, cream-highlight to deep-brown rim.
      3. Spec  — small inner specular highlight, top-left, gives the
                 orb a sense of depth (and reads as a single "dot of
                 warmth" even at favicon size).

    Renders cleanly on light and dark browser tab backgrounds because
    the rim is dark brown — the orb has a defined edge either way.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#e08818" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#e08818" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="35%" cy="28%" r="65%">
      <stop offset="0%"   stop-color="#ffe7b2"/>
      <stop offset="38%"  stop-color="#f3a02b"/>
      <stop offset="70%"  stop-color="#bd6a0d"/>
      <stop offset="100%" stop-color="#3f2305"/>
    </radialGradient>
    <radialGradient id="spec" cx="35%" cy="30%" r="22%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="16"   fill="url(#halo)"/>
  <circle cx="16" cy="16" r="12.5" fill="url(#orb)"/>
  <ellipse cx="12" cy="11.5" rx="5" ry="3.5" fill="url(#spec)"/>
</svg>
