name: CI

# Public CI: runs on every push to main + every PR. Does ONLY static checks
# (lint, typecheck, unit tests) — no DB, no external API keys, no E2E.
# Integration + Playwright E2E live in `e2e.yml` and only run on demand.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @speakwise/db prisma:generate
      - name: Lint (Biome)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (Vitest)
        run: pnpm --filter speakwise-web exec vitest run tests/unit
