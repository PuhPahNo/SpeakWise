# Render Blueprint — Speakwise.
# Apply via: https://dashboard.render.com/blueprints → New Blueprint Instance.
# Render creates ONE Postgres + ONE Web Service and prompts for any environment
# variables marked sync:false. Scheduled work (review/comeback offers, memory
# extraction) runs INSIDE the web service via an in-process scheduler
# (apps/web/src/instrumentation.ts), so there are no separate cron services.

databases:
  - name: speakwise-db
    databaseName: speakwise
    user: speakwise
    plan: basic-256mb
    postgresMajorVersion: 16
    ipAllowList: []

services:
  # ── Web (Next.js) ─────────────────────────────────────────────────────
  - type: web
    name: speakwise-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: apps/web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @speakwise/db prisma:generate && pnpm --filter speakwise-web build
    # Runs after build, before the new version goes live, with DB + env access.
    # No migrations in this repo — schema is applied via `prisma db push`; the
    # seed (curriculum + prompts) is idempotent. Both safe to run every deploy.
    preDeployCommand: pnpm --filter @speakwise/db exec prisma db push && pnpm --filter @speakwise/db exec tsx src/seed.ts
    startCommand: pnpm --filter speakwise-web start
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: speakwise-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: speakwise-db
          property: connectionString
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ORG_ID
        sync: false
      - key: OPENAI_MODEL_FAST
        value: gpt-4o-mini
      - key: OPENAI_MODEL_REASONING
        value: gpt-4o
      - key: OPENAI_MODEL_EMBEDDING
        value: text-embedding-3-small
      - key: OPENAI_MODEL_STT
        value: whisper-1
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_turbo_v2_5
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_KEY
        sync: false
      - key: NEXT_PUBLIC_POSTHOG_HOST
        value: https://us.i.posthog.com
      # Still used to protect the /api/cron/* endpoints for manual/forced runs.
      # The in-process scheduler calls the job logic directly (no HTTP, no secret).
      - key: CRON_SECRET
        generateValue: true
