# Render Blueprint — Speakwise.
# Apply via: https://dashboard.render.com/blueprints → New Blueprint Instance.
# Render creates ONE Postgres + ONE Web Service and prompts for any environment
# variables marked sync:false. Scheduled work (review/comeback offers, memory
# extraction) runs INSIDE the web service via an in-process scheduler
# (apps/web/src/instrumentation.ts), so there are no separate cron services.

databases:
  - name: speakwise-db
    databaseName: speakwise
    user: speakwise
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: 16
    ipAllowList: []

services:
  # ── Web (Next.js) ─────────────────────────────────────────────────────
  - type: web
    name: speakwise-web
    runtime: node
    plan: starter
    region: ohio
    # Install pnpm via npm (writable global prefix). `corepack enable` fails on
    # Render's builder with EROFS because it tries to symlink into read-only
    # /usr/bin. Build runs from the repo root so pnpm resolves the workspace.
    # --prod=false: NODE_ENV=production otherwise makes pnpm skip devDependencies,
    # but prisma/tsx/typescript/tailwind are devDeps needed at build + pre-deploy.
    buildCommand: npm install -g pnpm@9.12.0 && pnpm install --frozen-lockfile --prod=false && pnpm --filter @speakwise/db prisma:generate && pnpm --filter speakwise-web build
    # Runs after build, before the new version goes live, with DB + env access.
    # The migration helper safely baselines databases created before migration
    # history was introduced, then applies versioned migrations normally.
    preDeployCommand: pnpm exec tsx scripts/migrate-deploy.ts && pnpm --filter @speakwise/db exec tsx src/seed.ts
    startCommand: pnpm --filter speakwise-web start
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      # Pin Node — an open-ended engines range let Render pick a bleeding-edge
      # Node (26.x). 22 is a stable LTS that Next 15 + Prisma 5 are tested on.
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: speakwise-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: speakwise-db
          property: connectionString
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_ORG_ID
        sync: false
      - key: OPENAI_MODEL_FAST
        value: gpt-4o-mini
      - key: OPENAI_MODEL_REASONING
        value: gpt-4o
      - key: OPENAI_MODEL_EMBEDDING
        value: text-embedding-3-small
      - key: OPENAI_MODEL_STT
        value: whisper-1
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_turbo_v2_5
      # Still used to protect the /api/cron/* endpoints for manual/forced runs.
      # The in-process scheduler calls the job logic directly (no HTTP, no secret).
      - key: CRON_SECRET
        generateValue: true
